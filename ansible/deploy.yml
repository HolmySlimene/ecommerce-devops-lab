- name: Deploy E-Commerce App
  hosts: web
  become: yes
  gather_facts: false   # ✅ évite bug Python

  tasks:

    - name: Install Docker
      yum:
        name: docker
        state: present

    - name: Start Docker
      service:
        name: docker
        state: started
        enabled: yes

    - name: Add ec2-user to docker group
      user:
        name: ec2-user
        groups: docker
        append: yes

    - name: Run nginx container
      command: docker run -d -p 80:80 nginx
