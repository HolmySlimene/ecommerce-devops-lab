---
- name: Deploy E-Commerce App
  hosts: web
  become: yes
  gather_facts: no

  tasks:
    - name: Install Python3 first
      raw: yum install -y python3
      
    - name: Install Docker
      raw: yum install -y docker

    - name: Start Docker
      raw: systemctl start docker && systemctl enable docker

    - name: Add ec2-user to docker group
      raw: usermod -aG docker ec2-user

    - name: Install Docker Compose
      raw: curl -L "https://github.com/docker/compose/releases/download/v2.20.0/docker-compose-linux-x86_64" -o /usr/local/bin/docker-compose && chmod +x /usr/local/bin/docker-compose

    - name: Create app directories
      raw: mkdir -p /home/ec2-user/app/server

    - name: Create docker-compose.yml
      copy:
        dest: /home/ec2-user/app/docker-compose.yml
        content: |
          version: '3.8'
          services:
            mongodb:
              image: mongo:6
              restart: always
              ports:
                - "27017:27017"

            app:
              image: node:18-alpine
              restart: always
              working_dir: /app
              volumes:
                - ./server:/app
              command: sh -c "npm install && node server.js"
              ports:
                - "3000:3000"
              depends_on:
                - mongodb
              environment:
                - MONGO_URL=mongodb://mongodb:27017/ecommerce

            nginx:
              image: nginx:alpine
              restart: always
              ports:
                - "80:80"
              volumes:
                - ./nginx.conf:/etc/nginx/conf.d/default.conf
              depends_on:
                - app

    - name: Create Node.js server
      copy:
        dest: /home/ec2-user/app/server/server.js
        content: |
          const express = require('express');
          const app = express();
          app.get('/', (req, res) => {
            res.send(`
              <html>
              <head><title>E-Commerce Store</title></head>
              <body>
                <h1>E-Commerce Store</h1>
                <p>- Laptop $1200</p>
                <p>- Phone $800</p>
              </body>
              </html>
            `);
          });
          app.listen(3000, () => console.log('App running on port 3000'));

    - name: Create package.json
      copy:
        dest: /home/ec2-user/app/server/package.json
        content: |
          {
            "name": "ecommerce",
            "version": "1.0.0",
            "dependencies": {
              "express": "^4.18.0"
            }
          }

    - name: Create Nginx config
      copy:
        dest: /home/ec2-user/app/nginx.conf
        content: |
          server {
            listen 80;
            location / {
              proxy_pass http://app:3000;
            }
          }

    - name: Run Docker Compose
      raw: cd /home/ec2-user/app && /usr/local/bin/docker-compose up -d
