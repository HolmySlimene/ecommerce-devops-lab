---
- name: Deploy E-Commerce App
  hosts: web
  become: yes

  tasks:
    - name: Update system
      yum:
        name: "*"
        state: latest

    - name: Install Docker
      yum:
        name: docker
        state: present

    - name: Start and enable Docker
      service:
        name: docker
        state: started
        enabled: yes

    - name: Add ec2-user to docker group
      user:
        name: ec2-user
        groups: docker
        append: yes

    - name: Install Docker Compose
      get_url:
        url: "https://github.com/docker/compose/releases/download/v2.20.0/docker-compose-linux-x86_64"
        dest: /usr/local/bin/docker-compose
        mode: '0755'

    - name: Create app directory
      file:
        path: /home/ec2-user/app
        state: directory
        owner: ec2-user

    - name: Create docker-compose.yml
      copy:
        dest: /home/ec2-user/app/docker-compose.yml
        content: |
          version: '3.8'
          services:
            mongodb:
              image: mongo:6
              restart: always
              ports:
                - "27017:27017"

            app:
              image: node:18-alpine
              restart: always
              working_dir: /app
              volumes:
                - ./server:/app
              command: sh -c "npm install && node server.js"
              ports:
                - "3000:3000"
              depends_on:
                - mongodb
              environment:
                - MONGO_URL=mongodb://mongodb:27017/ecommerce

            nginx:
              image: nginx:alpine
              restart: always
              ports:
                - "80:80"
              volumes:
                - ./nginx.conf:/etc/nginx/conf.d/default.conf
              depends_on:
                - app

    - name: Create Node.js app
      copy:
        dest: /home/ec2-user/app/server/server.js
        content: |
          const express = require('express');
          const app = express();
          app.get('/', (req, res) => {
            res.send(`
              <h1>E-Commerce Store</h1>
              <p>- Laptop $1200</p>
              <p>- Phone $800</p>
            `);
          });
          app.listen(3000, () => console.log('App running on port 3000'));

    - name: Create package.json
      copy:
        dest: /home/ec2-user/app/server/package.json
        content: |
          {
            "name": "ecommerce",
            "version": "1.0.0",
            "dependencies": {
              "express": "^4.18.0"
            }
          }

    - name: Create Nginx config
      copy:
        dest: /home/ec2-user/app/nginx.conf
        content: |
          server {
            listen 80;
            location / {
              proxy_pass http://app:3000;
            }
          }

    - name: Run Docker Compose
      shell: docker-compose up -d
      args:
        chdir: /home/ec2-user/app
