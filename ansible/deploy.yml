---
- name: Deploy E-Commerce App
  hosts: web
  become: yes
  gather_facts: no

  tasks:
    - name: Install Docker
      yum:
        name: docker
        state: present

    - name: Start and enable Docker
      service:
        name: docker
        state: started
        enabled: yes

    - name: Add ec2-user to docker group
      user:
        name: ec2-user
        groups: docker
        append: yes

    - name: Install Docker Compose
      get_url:
        url: "https://github.com/docker/compose/releases/download/v2.20.0/docker-compose-linux-x86_64"
        dest: /usr/local/bin/docker-compose
        mode: '0755'

    - name: Create app directory
      file:
        path: /home/ec2-user/app
        state: directory
        owner: ec2-user

    - name: Create server directory
      file:
        path: /home/ec2-user/app/server
        state: directory
        owner: ec2-user

    - name: Create docker-compose.yml
      copy:
        dest: /home/ec2-user/app/docker-compose.yml
        content: |
          version: '3.8'
          services:
            mongodb:
              image: mongo:6
              restart: always
              ports:
                - "27017:27017"

            app:
              image: node:18-alpine
              restart: always
              working_dir: /app
              volumes:
                - ./server:/app
              command: sh -c "npm install && node server.js"
              ports:
                - "3000:3000"
